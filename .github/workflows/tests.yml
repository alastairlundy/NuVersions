name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions: read-all

jobs:
  test:
    name: Run fuzz tests
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "src/NuVersions.slnx"

      - name: Build
        run: dotnet build -c Release --no-restore "src/NuVersions.slnx"

      - name: Run fuzz tests
        run: dotnet test tests/NuVersionsLib.FuzzTests --no-build -c Release
