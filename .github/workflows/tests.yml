name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions: read-all

jobs:
  test:
    name: Run fuzz tests
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "src/NuVersions.slnx"

      - name: Build
        run: dotnet build -c Release --no-restore "src/NuVersions.slnx"

      - name: Run fuzz tests
        run: dotnet test tests/NuVersionsLib.FuzzTests --no-build -c Release
